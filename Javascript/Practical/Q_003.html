
<!-- o Create a JavaScript program to perform the following:
1. Add, subtract, multiply, and divide two numbers using arithmetic operators.
2. Use comparison operators to check if two numbers are equal and if one
number is greater than the other.
3. Use logical operators to check if both conditions (e.g., a > 10 and b < 5) are
true. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 20;
        let b = 5;

        let add = a+b;
        let sub = a-b;
        let mul = a*b;
        let div = a/b;

        console.log(add);
        console.log(sub);
        console.log(mul);
        console.log(div);

        console.log(a==b);
        console.log(a>b);

        console.log(a>b && b<a);

    </script>
</body>
</html>
