<!--
o Create a simple HTML page and add a <script> tag within the page.
o Write JavaScript code to display an alert box with the message "Welcome to
JavaScript!" when the page loads. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome Page</h1>
    <p>This is a simple HTML page.</p>

    <script>
      alert("Welcome to JavaScript!");
    </script>
  </body>
</html>
