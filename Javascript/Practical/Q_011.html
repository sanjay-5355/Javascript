<!-- Declare an array of fruits (["apple", "banana", "cherry"]). Use JavaScript to:
1. Add a fruit to the end of the array.
2. Remove the first fruit from the array.
3. Log the modified array to the console. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let fruits = ["apple", "banana", "cherry"];

      fruits.push("orange");
      fruits.shift();

      console.log(fruits);
    </script>
  </body>
</html>
