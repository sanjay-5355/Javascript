<!-- o Create an HTML page with a paragraph (<p>) that displays "Hello, World!".
o Use JavaScript to:
1. Change the text inside the paragraph to "JavaScript is fun!".
2. Change the color of the paragraph to blue. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id ="text" >Hello World!</p>
    <script>
        document.getElementById("text").innerText = "JavaScript is fun!";
        document.getElementById("text").style.color ="blue";
    </script>
</body>
</html>
