<!-- o Create a JavaScript object car with properties brand, model, and year. Use
JavaScriptto:
1. Access and print the car’s brand and model.
2. Update the year property.
3. Add a new property color to the car object. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let car = {
            brand:"Toyota",
            model:"Xyz",
            year:2020
        }

        console.log(car.brand);
        console.log(car.model);
        console.log(car.year);


        car.year = 2024;

        car.color = "black";

        console.log(car)

    </script>
</body>
</html>
