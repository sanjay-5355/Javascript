<!-- Write a JavaScript program that attempts to divide a number by zero. Use trycatchto handle the error and display an appropriate error message. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      try {
        let a = 10;
        let b = 0;

        if (b === 0) {
          throw "Cannot divide by zero";
        }

        let result = a / b;
        document.write(result);
      } catch (error) {
        document.write("Error: " + error);
      }
    </script>
  </body>
</html>
