<!-- Write a do-while loop that continues to ask the user for input until they enter
anumber greater than 10. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     let num ;

     do {
      num = parseInt(prompt("Enter a number greater then 10"))
     }while(num <=10)

     console.log(num);
    </script>
</body>
</html>
